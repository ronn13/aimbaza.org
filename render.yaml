services:
  - type: web
    name: aimbaza-staging
    env: python
    region: frankfurt
    plan: free
    branch: develop
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn aimbaza.wsgi --workers 2 --log-file -
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: aimbaza.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: staging.aimbaza.org
      - key: DATABASE_URL
        value: sqlite:///db.sqlite3
