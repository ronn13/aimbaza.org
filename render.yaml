databases:
  - name: aimbaza-db
    plan: starter
    region: frankfurt

services:

  # ── Production ───────────────────────────────────────────────────────────────
  - type: web
    name: aimbaza-production
    env: python
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: >-
      pip install -r requirements/production.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn aimbaza.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --log-file -
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: aimbaza.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: aimbaza.org,www.aimbaza.org
      - key: DATABASE_URL
        fromDatabase:
          name: aimbaza-db
          property: connectionString
      - key: SITE_URL
        value: https://aimbaza.org
      - key: PLAUSIBLE_DOMAIN
        value: ""

  # ── Staging ──────────────────────────────────────────────────────────────────
  - type: web
    name: aimbaza-staging
    env: python
    region: frankfurt
    plan: free
    branch: develop
    buildCommand: >-
      pip install -r requirements/production.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn aimbaza.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --log-file -
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: aimbaza.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: staging.aimbaza.org
      - key: DATABASE_URL
        value: sqlite:///db.sqlite3
