# International events data — source of truth for the /events/ international section.
#
# pinned: true  — manually curated, never modified by fetch_events
# pinned: false — managed by fetch_events management command
#
# Fields:
#   id                  unique slug
#   title               display name
#   description         1-2 sentences
#   url                 primary link
#   location            city, country or "Virtual"
#   deadline            ISO date (YYYY-MM-DD) for application/registration deadline (optional)
#   has_sponsorship     bool — true if travel grants / scholarships are available
#   sponsorship_details short text describing the sponsorship (optional)
#   source              name of the RSS source or "manual"
#   pinned              bool
#   added_date          ISO date this entry was added
#   active              bool — false hides from page

