# pinned: true  — manually curated, never modified by fetch_opportunities
# pinned: false — may be updated or marked stale by fetch_opportunities
#
# Categories: computing | grants | fellowships
#
# Fields:
#   id          unique slug (used for deduplication)
#   title       display name
#   category    computing | grants | fellowships
#   description one or two sentences shown on the card
#   url         primary link (call-to-action button)
#   button_text text for the CTA button (default: "Learn more →")
#   pinned      bool — if true, fetch_opportunities will not touch this entry
#   rss_url     optional — the RSS feed URL for this source (used by fetch_opportunities)
#   added_date  ISO date this entry was added (YYYY-MM-DD)
#   active      bool — set to false to hide from the page without deleting

