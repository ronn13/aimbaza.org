# Partner registry — source of truth for /community/partners/
#
# Fields:
#   id            unique slug
#   name          display name
#   type          funding | data | research | community
#   description   2-3 sentences on the relationship and collaboration
#   url           partner website
#   logo          filename in static/images/partners/ (optional)
#   logo_text     short text shown when no logo image is available
#   active        bool — false hides from page

- id: giz
  name: GIZ Digital Transformation Center Rwanda
  type: funding
  description: >
    The Deutsche Gesellschaft für Internationale Zusammenarbeit (GIZ) funds MbazaNLP's
    community infrastructure work through the Digital Transformation Center Rwanda
    (contract G-011174-077). GIZ's support covers website development, community
    engineering standards, model documentation, and community events through the
    DPG (Digital Public Good) maintainer programme.
  url: https://www.giz.de/en/worldwide/33041.html
  logo: giz.jpg
  logo_text: GIZ
  active: true

- id: digital-umuganda
  name: Digital Umuganda
  type: data
  description: >
    Digital Umuganda is a community-driven initiative that collects and open-sources
    Kinyarwanda language data through collaborative crowdsourcing. MbazaNLP's translation
    and speech models draw on data collected through Digital Umuganda campaigns, and the
    two communities share contributors and coordinate data collection sprints.
  url: https://digitalumuganda.com
  logo: digital-umuganda.jpg
  logo_text: Digital Umuganda
  active: true

- id: fairforward
  name: FairForward
  type: research
  description: >
    FairForward is a GIZ initiative working to make AI more open, fair, and accessible
    in the Global South. FairForward supports MbazaNLP's work on responsible AI practices
    for low-resource African languages, including model documentation standards, bias
    disclosure, and the open licensing of all community outputs under Apache 2.0 and CC-BY.
  url: https://fair-forward.github.io
  logo: fairforward.jpg
  logo_text: FairForward
  active: true

- id: masakhane
  name: Masakhane
  type: community
  description: >
    Masakhane is a pan-African NLP research community focused on African languages.
    MbazaNLP collaborates with Masakhane on research methodology, evaluation benchmarks,
    and grant applications. Community members participate in Masakhane research calls and
    contribute to shared datasets and models for East African languages.
  url: https://www.masakhane.io
  logo: masakhane.png
  logo_text: Masakhane
  active: true

- id: cmu-africa
  name: Carnegie Mellon University Africa
  type: research
  description: >
    CMU Africa's graduate programme in Engineering AI in Kigali provides a pipeline of
    NLP researchers and engineers engaged with MbazaNLP's work. Community members have
    drawn on CMU Africa's computing resources and research expertise for model development
    and evaluation on Kinyarwanda benchmarks.
  url: https://www.africa.engineering.cmu.edu
  logo: cmu-africa.png
  logo_text: CMU Africa
  active: true

- id: university-of-rwanda
  name: University of Rwanda
  type: research
  description: >
    The University of Rwanda is the country's largest public university, with faculties
    spanning science, engineering, and social sciences. UR collaborates with MbazaNLP on
    Kinyarwanda NLP research, providing academic expertise and student contributors to
    dataset creation and model evaluation work.
  url: https://www.ur.ac.rw/
  logo: ur.png
  logo_text: University of Rwanda
  active: true

- id: shecancode
  name: SheCanCode
  type: community
  description: >
    SheCanCode is Rwanda's leading coding bootcamp for women, training hundreds of female
    software developers across cohorts in Kigali. MbazaNLP partners with SheCanCode to
    engage women technologists in African language AI, broadening participation in NLP
    research and open-source contributions.
  url: https://www.shecancodeschool.org/
  logo: shecancode.png
  logo_text: SheCanCode
  active: true

- id: klab
  name: kLab Rwanda
  type: community
  description: >
    kLab is Rwanda's premier technology innovation hub, supporting startups and tech
    communities in Kigali. Through kLab's co-working space and events programme,
    MbazaNLP hosts community sprints, hackathons, and workshops on Kinyarwanda NLP
    tools and applications.
  url: https://klab.rw/
  logo: klab.png
  logo_text: kLab Rwanda
  active: true

- id: risa
  name: Rwanda Information Society Authority
  type: community
  description: >
    RISA is the Rwandan government agency responsible for ICT and digital transformation.
    RISA supports MbazaNLP's work on Kinyarwanda language technology as part of Rwanda's
    broader digital economy and e-government agenda, and facilitates links between the
    community and government data partners.
  url: https://www.risa.gov.rw/
  logo: risa.png
  logo_text: RISA
  active: true
